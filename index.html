<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>Spooky Yummy Dummy</title>
  <!-- link to your single stylesheet -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- 1) Preloader overlay with progress bar -->
  <div id="preloader">
    <div id="progress-bar"></div>
  </div>

  <!-- 2) Real content, hidden until everything loads -->
  <div id="main-content" style="visibility:hidden;">
    <!-- Import maps polyfill for older browsers -->
    <script async src="https://unpkg.com/es-module-shims@1.3.6/dist/es-module-shims.js"></script>
    <!-- Import map to define module paths -->
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.149.0/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.149.0/examples/jsm/"
        }
      }
    </script>
    <!-- Your main Three.js script -->
    <script type="module" src="script.js"></script>
  </div>

</body>

</html>
